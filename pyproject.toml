[project]
name = "aigt-inference"
authors = [
    {name = "Mahdi Bahous",email = "mehdi7bs@gmail.com"}
]
version = "0.1.0"
description = "Fastapi server to interact with the 'mehddii/roberta-aigt-finetuning-v4' model."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "transformers>=5.6.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
